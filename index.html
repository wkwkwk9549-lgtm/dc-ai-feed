<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>내 특갤 피드</title>
  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%EB%82%B4%20%ED%8A%B9%EA%B0%A4%20%ED%94%BC%EB%93%9C%22%2C%22short_name%22%3A%22%ED%8A%B9%EA%B0%A4%20%ED%94%BC%EB%93%9C%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%7D' />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .snippet {
      font-size: 12px; color: #94a3b8; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: keep-all;
    }
    .card.read .snippet { color: #475569; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      background: #0f172a; color: #f1f5f9; padding-bottom: 40px;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px);
      padding: 12px 14px; border-bottom: 1px solid #1e293b;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
    h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .right-box { display: flex; align-items: center; gap: 6px; }
    .status-txt { font-size: 11px; color: #94a3b8; white-space: nowrap; }
    .action-btn {
      background: #1e293b; color: #93c5fd; border: 1px solid #334155;
      padding: 5px 9px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .action-btn.crawl { background: #1d4ed8; color: #fff; border-color: #2563eb; font-weight: 600; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; }
    .tab {
      background: #1e293b; color: #94a3b8; border: none;
      padding: 6px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap; cursor: pointer;
    }
    .tab.active { background: #3b82f6; color: #fff; font-weight: 600; }
    .feed { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #1e293b; border-radius: 12px; padding: 12px 14px;
      border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px;
    }
    .card.hot { border-color: #f59e0b; background: linear-gradient(180deg, #27231d 0%, #1e293b 100%); }
    .card.liked { border-color: #22c55e; }
    .card.disliked { opacity: 0.45; }
    .meta { display: flex; gap: 5px; align-items: center; font-size: 11px; color: #94a3b8; flex-wrap: wrap; }
    .badge {
      background: #334155; color: #e2e8f0; padding: 2px 6px; border-radius: 5px; font-weight: 600;
    }
    .hot-badge {
      background: #78350f; color: #fde68a; border: 1px solid #f59e0b;
      padding: 1px 5px; border-radius: 4px; font-size: 10px; font-weight: 700;
    }
    .read-badge {
      background: #0f172a; color: #64748b; border: 1px solid #334155;
      padding: 1px 5px; border-radius: 4px; font-size: 10px;
    }
    .score-tag { margin-left: auto; color: #60a5fa; font-weight: 600; }
    .title {
      color: #f8fafc; text-decoration: none; font-size: 15px; line-height: 1.4; font-weight: 500;
      word-break: keep-all;
    }
    .card.read .title { color: #64748b; font-weight: 400; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
    .stats { font-size: 11px; color: #64748b; }
    .btns { display: flex; gap: 8px; }
    <div class="btns">
                <button class="fb-btn ${p.feedback === 1 ? 'on-like' : ''}" onclick="vote('${p.id}', 1)">👍 좋음</button>
                <button class="fb-btn ${p.feedback === -1 ? 'on-dislike' : ''}" onclick="vote('${p.id}', -1)">👎 싫음</button>
                <button class="fb-btn" onclick="deletePost('${p.id}')" title="삭제된 글 숨기기">🗑️</button>
              </div>
    .fb-btn {
      background: #0f172a; border: 1px solid #334155; color: #cbd5e1;
      padding: 5px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .fb-btn.on-like { background: #14532d; border-color: #22c55e; color: #bbf7d0; }
    .fb-btn.on-dislike { background: #450a0a; border-color: #ef4444; color: #fecaca; }

    /* 키워드 관리 모달 */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(4px);
      align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%; max-width: 540px; max-height: 82vh;
      background: #1e293b; border-top-left-radius: 18px; border-top-right-radius: 18px;
      border-top: 1px solid #334155; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; }
    .modal-head h2 { font-size: 16px; font-weight: 700; }
    .close-btn {
      background: #334155; color: #e2e8f0; border: none;
      padding: 4px 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .kw-form { display: flex; gap: 6px; }
    .kw-input {
      flex: 1; background: #0f172a; border: 1px solid #334155; color: #f8fafc;
      padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none;
    }
    .kw-input:focus { border-color: #3b82f6; }
    .kw-btn {
      border: none; padding: 8px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .kw-btn.boost { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }
    .kw-btn.block { background: #450a0a; color: #fecaca; border: 1px solid #ef4444; }
    .kw-hint { font-size: 11px; color: #94a3b8; line-height: 1.4; }
    .kw-list {
      overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px;
    }
    .kw-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; border: 1px solid #334155; padding: 7px 10px; border-radius: 8px; font-size: 13px;
    }
    .kw-score.pos { color: #4ade80; font-weight: 600; }
    .kw-score.neg { color: #f87171; font-weight: 600; }
    .kw-score.ban { color: #ef4444; font-weight: 700; }
    .kw-del {
      background: transparent; border: 1px solid #475569; color: #94a3b8;
      padding: 2px 7px; border-radius: 6px; font-size: 11px; margin-left: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <h1>🤖 내 특갤 피드</h1>
      <div class="right-box">
        <span class="status-txt" id="statusTxt">대기 중</span>
        <button class="action-btn crawl" id="crawlBtn" onclick="triggerCrawl()">⚡ 수집</button>
        <button class="action-btn" id="refreshBtn" onclick="loadData()">새로고침</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-sort="smart" onclick="setSort('smart', this)">✨ 내 취향순</button>
      <button class="tab" data-sort="recent" onclick="setSort('recent', this)">🕒 최신순</button>
      <button class="tab" id="unreadToggle" onclick="toggleUnread(this)">👀 안 읽은 글만</button>
      <button class="tab" onclick="openKwModal()">⚙️ 키워드</button>
    </div>
  </header>

  <main class="feed" id="feed">불러오는 중...</main>

  <!-- 키워드 관리 모달 -->
  <div class="modal-backdrop" id="kwModal" onclick="if(event.target===this) closeKwModal()">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>⚙️ 취향 · 차단 키워드 관리</h2>
        <button class="close-btn" onclick="closeKwModal()">닫기</button>
      </div>
      <div class="kw-form">
        <input type="text" class="kw-input" id="kwInput" placeholder="예: claude, 친목, sub:정보" onkeydown="if(event.key==='Enter') addKeyword(10)" />
        <button class="kw-btn boost" onclick="addKeyword(10)">🚀 +10점</button>
        <button class="kw-btn block" onclick="addKeyword(-999)">🚫 완전차단</button>
      </div>
      <p class="kw-hint">
        • <b>완전차단(-999점)</b> 등록 시 해당 단어가 들어간 글은 피드에서 완전히 숨겨집니다.<br/>
        • 말머리 제어는 <b>sub:일반</b>, <b>sub:정보</b> 형식으로 입력하세요.
      </p>
      <div class="kw-list" id="kwList"></div>
    </div>
  </div>

  <script>
    async function deletePost(postId) {
      posts = posts.filter(p => p.id !== postId);
      render();
      await db.from("dc_posts").delete().eq("id", postId);
    }
    const SUPABASE_URL = "https://kfmqoicilcunpahxgyek.supabase.co";
    // ▼ 아래 따옴표 안에 Supabase Legacy 탭의 anon 키(eyJ...)를 붙여넣으세요
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmbXFvaWNpbGN1bnBhaHhneWVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2ODY0NDcsImV4cCI6MjExMTI2MjQ0N30.s-amBbpBGMSVTMtaiQGVVwVBd8oxXGPGLfLgKwGFhB8";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const GH_OWNER = "wkwkwk9549-lgtm";
    const GH_REPO = "dc-ai-feed";
    const GH_WORKFLOW = "crawl.yml";
    const GH_PAT_KEY = "dc_feed_gh_pat";

    const READ_STORAGE_KEY = "dc_feed_read_ids";
    let readSet = new Set(JSON.parse(localStorage.getItem(READ_STORAGE_KEY) || "[]"));

    let posts = [];
    let weights = {};
    let currentSort = "smart";
    let onlyUnread = false;
    let isCrawling = false;
    let pollTimers = [];
    let lastLoadedAt = 0;

    const STOPWORDS = new Set([
      "진짜", "오늘", "지금", "방금", "아까", "내일", "요즘", "그냥", "근데", "그래서",
      "이거", "저거", "그거", "뭐임", "뭐냐", "뭔가", "왜이럼", "어떻게", "어떡함",
      "질문", "질문좀", "있음", "없음", "있냐", "없냐", "가능", "불가능", "정도",
      "완전", "너무", "존나", "개추", "추천", "개념", "ㅇㅇ", "ㅋㅋ", "ㅎㅎ", "ㅠㅠ",
      "사람", "생각", "느낌", "이유", "문제", "상황", "현황", "근황", "이번", "다음"
    ]);

    function stripJosa(word) {
      if (!/[가-힣]$/.test(word)) return word;
      const suffixes = [
        "에서는", "에게는", "으로는", "이라고", "이라는", "이나마",
        "에서", "에게", "한테", "으로", "부터", "까지", "처럼", "보다", "마저", "조차", "밖에", "이랑", "하고", "이나", "인가", "인지", "인데", "인데도",
        "은", "는", "이", "가", "을", "를", "에", "의", "도", "만", "로", "와", "과", "랑", "나", "야", "임", "함", "됨"
      ];
      for (const s of suffixes) {
        if (word.endsWith(s) && word.length - s.length >= 2) {
          return word.slice(0, -s.length);
        }
      }
      return word;
    }

function extractTokens(post) {
      const tokens = new Set();
      if (post.subject) tokens.add(`sub:${post.subject.toLowerCase()}`);

      const combinedText = `${post.title} ${(post.content || "").slice(0, 300)}`;
      const rawWords = combinedText
        .toLowerCase()
        .replace(/[^가-힣a-z0-9\s]/g, " ")
        .split(/\s+/);

      for (const raw of rawWords) {
        if (raw.length < 2) continue;
        const clean = stripJosa(raw);
        if (clean.length < 2) continue;
        if (STOPWORDS.has(clean) || STOPWORDS.has(raw)) continue;
        if (/^\d+$/.test(clean)) continue;
        tokens.add(clean);
      }
      return Array.from(tokens);
    }

    function isBlockedPost(post) {
      const fullTextLower = `${post.title} ${post.content || ""}`.toLowerCase();
      const subjToken = post.subject ? `sub:${post.subject.toLowerCase()}` : "";
      for (const [token, score] of Object.entries(weights)) {
        if (score <= -500) {
          if (token.startsWith("sub:")) {
            if (subjToken === token) return true;
          } else if (fullTextLower.includes(token)) {
            return true;
          }
        }
      }
      return false;
    }
function isHotPost(post) {
      return (post.recommend || 0) >= 5 || (post.views || 0) >= 300;
    }
    function calcScore(post) {
      const tokens = extractTokens(post);
      let pref = 0;
      tokens.forEach(t => { pref += (weights[t] || 0); });

      const fullTextLower = `${post.title} ${post.content || ""}`.toLowerCase();
      const tokenSet = new Set(tokens);
      for (const [kw, score] of Object.entries(weights)) {
        if (score >= 10 && !kw.startsWith("sub:") && !tokenSet.has(kw) && fullTextLower.includes(kw)) {
          pref += score;
        }
      }

      const ageHours = (Date.now() - new Date(post.created_at).getTime()) / 3600000;
      const freshness = Math.max(0, 6 - ageHours * 0.25);
      const recBonus = Math.min(6, (post.recommend || 0) * 0.6);
      const hotBonus = isHotPost(post) ? 2.5 : 0;

      return Number((pref * 1.5 + freshness + recBonus + hotBonus).toFixed(1));
    }

    function openKwModal() {
      renderKwList();
      document.getElementById("kwModal").classList.add("open");
      setTimeout(() => document.getElementById("kwInput").focus(), 100);
    }

    function closeKwModal() {
      document.getElementById("kwModal").classList.remove("open");
    }

    function renderKwList() {
      const listEl = document.getElementById("kwList");
      const entries = Object.entries(weights)
        .filter(([, s]) => s !== 0)
        .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));

      if (!entries.length) {
        listEl.innerHTML = "<p style='color:#64748b;font-size:12px;padding:12px 0;'>등록되거나 학습된 키워드가 아직 없습니다.</p>";
        return;
      }

      listEl.innerHTML = entries.map(([token, score]) => {
        const cls = score <= -500 ? "ban" : (score > 0 ? "pos" : "neg");
        const label = score <= -500 ? "🚫 차단됨" : `${score > 0 ? "+" : ""}${score}점`;
        const safeToken = token.replace(/'/g, "\\'");
        return `
          <div class="kw-item">
            <span>${token}</span>
            <div>
              <span class="kw-score ${cls}">${label}</span>
              <button class="kw-del" onclick="removeKeyword('${safeToken}')">삭제</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function addKeyword(scoreVal) {
      const input = document.getElementById("kwInput");
      let kw = input.value.trim().toLowerCase();
      if (!kw) return;
      if (!kw.startsWith("sub:")) {
        kw = stripJosa(kw);
      }
      input.value = "";

      weights[kw] = scoreVal;
      renderKwList();
      render();

      await db.from("user_weights").upsert(
        { token: kw, score: scoreVal, updated_at: new Date().toISOString() },
        { on_conflict: "token" }
      );
    }

    async function removeKeyword(token) {
      delete weights[token];
      renderKwList();
      render();
      await db.from("user_weights").delete().eq("token", token);
    }

    function clearPollTimers() {
      pollTimers.forEach(id => clearTimeout(id));
      pollTimers = [];
    }

    function getFeedSignature(list) {
      const maxPostNo = list.reduce((m, p) => Math.max(m, Number(p.post_no) || 0), 0);
      return `${list.length}:${maxPostNo}`;
    }

    async function triggerCrawl() {
      if (isCrawling) return;

      let pat = localStorage.getItem(GH_PAT_KEY);
      if (!pat) {
        pat = prompt("GitHub 토큰(github_pat_...)을 한 번만 입력하세요.\n(이 기기 브라우저에만 안전하게 저장됩니다)");
        if (!pat) return;
        pat = pat.trim();
        localStorage.setItem(GH_PAT_KEY, pat);
      }

      clearPollTimers();
      isCrawling = true;

      const btn = document.getElementById("crawlBtn");
      const statusTxt = document.getElementById("statusTxt");
      btn.disabled = true;
      btn.textContent = "수집중";
      statusTxt.textContent = "즉시 조회 + 요청 중";

      const beforeSig = getFeedSignature(posts);
      await loadData();

      try {
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${GH_WORKFLOW}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${pat}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem(GH_PAT_KEY);
          throw new Error("토큰 권한 오류 (다시 눌러 새 토큰을 입력하세요)");
        }
        if (!res.ok) throw new Error(`GitHub 응답 오류 (${res.status})`);

        const checkpoints = [5, 11, 18, 26];
        checkpoints.forEach((sec, idx) => {
          const timerId = setTimeout(async () => {
            if (!isCrawling) return;
            statusTxt.textContent = `반영 확인 (${idx + 1}/${checkpoints.length})`;
            await loadData();
            const afterSig = getFeedSignature(posts);
            const isLast = idx === checkpoints.length - 1;

            if (afterSig !== beforeSig || isLast) {
              clearPollTimers();
              isCrawling = false;
              btn.disabled = false;
              btn.textContent = "⚡ 수집";
            }
          }, sec * 1000);
          pollTimers.push(timerId);
        });
      } catch (err) {
        clearPollTimers();
        alert(err.message);
        statusTxt.textContent = "수집 실패";
        isCrawling = false;
        btn.disabled = false;
        btn.textContent = "⚡ 수집";
      }
    }

    function markRead(postId) {
      if (!readSet.has(postId)) {
        readSet.add(postId);
        const arr = Array.from(readSet).slice(-1000);
        readSet = new Set(arr);
        localStorage.setItem(READ_STORAGE_KEY, JSON.stringify(arr));
        render();
      }
    }

    function toggleUnread(el) {
      onlyUnread = !onlyUnread;
      el.classList.toggle("active", onlyUnread);
      render();
    }

    async function loadData() {
      const btn = document.getElementById("refreshBtn");
      const statusTxt = document.getElementById("statusTxt");
      const feed = document.getElementById("feed");

      btn.disabled = true;
      btn.textContent = "로딩중...";
      if (!isCrawling) statusTxt.textContent = "DB 조회 중";

      try {
        const [postRes, weightRes] = await Promise.all([
          db.from("dc_posts").select("*").eq("gallery_id", "thesingularity").order("post_no", { ascending: false }).limit(200),
          db.from("user_weights").select("*")
        ]);

        if (postRes.error) throw postRes.error;
        if (weightRes.error) throw weightRes.error;

        posts = postRes.data || [];
        weights = {};
        (weightRes.data || []).forEach(r => { weights[r.token] = r.score; });

        lastLoadedAt = Date.now();
        const now = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        if (!isCrawling) statusTxt.textContent = `${posts.length}건 (${now})`;
        render();
      } catch (err) {
        statusTxt.textContent = "오류 발생";
        feed.innerHTML = `<p style="color:#f87171;padding:16px;">연결 오류: ${err.message || JSON.stringify(err)}</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "새로고침";
      }
    }

    async function vote(postId, value) {
      const post = posts.find(p => p.id === postId);
      if (!post) return;

      const nextVal = post.feedback === value ? 0 : value;
      const delta = nextVal - post.feedback;
      post.feedback = nextVal;

      const tokens = extractTokens(post);
      const upserts = tokens.map(t => {
        const nextScore = (weights[t] || 0) + delta;
        weights[t] = nextScore;
        return { token: t, score: nextScore, updated_at: new Date().toISOString() };
      });

      render();
      await Promise.all([
        db.from("dc_posts").update({ feedback: nextVal }).eq("id", postId),
        db.from("user_weights").upsert(upserts, { on_conflict: "token" })
      ]);
    }

    function setSort(mode, el) {
      currentSort = mode;
      document.querySelectorAll("[data-sort]").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
      render();
    }

    function render() {
      const feed = document.getElementById("feed");
      let list = posts.filter(p => !isBlockedPost(p));
      if (onlyUnread) {
        list = list.filter(p => !readSet.has(p.id));
      }

      list = list.map(p => ({ ...p, _score: calcScore(p), _hot: isHotPost(p) }));

      if (currentSort === "smart") {
        list.sort((a, b) => b._score - a._score);
      } else {
        list.sort((a, b) => (Number(b.post_no) || 0) - (Number(a.post_no) || 0));
      }

      if (!list.length) {
        feed.innerHTML = "<p style='color:#94a3b8;padding:20px;'>표시할 글이 없습니다.</p>";
        return;
      }

   feed.innerHTML = list.map(p => {
        const isRead = readSet.has(p.id);
        const safeSnippet = (p.content || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        return `
          <article class="card ${p._hot ? 'hot' : ''} ${p.feedback === 1 ? 'liked' : ''} ${p.feedback === -1 ? 'disliked' : ''} ${isRead ? 'read' : ''}">
            <div class="meta">
              <span class="badge">${p.gallery_name}</span>
              ${p._hot ? `<span class="hot-badge">🔥 인기</span>` : ""}
              ${p.subject ? `<span>[${p.subject}]</span>` : ""}
              <span>${new Date(p.created_at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false })}</span>
              ${isRead ? `<span class="read-badge">읽음</span>` : ""}
              <span class="score-tag">취향 ${p._score}</span>
            </div>
            <a class="title" href="${p.url}" target="_blank" rel="noopener" onclick="markRead('${p.id}')">${p.title}</a>
            ${safeSnippet ? `<p class="snippet">${safeSnippet}</p>` : ""}
            <div class="actions">
              <span class="stats">추천 ${p.recommend} · 조회 ${p.views}</span>
              <div class="btns">
                <button class="fb-btn ${p.feedback === 1 ? 'on-like' : ''}" onclick="vote('${p.id}', 1)">👍 좋음</button>
                <button class="fb-btn ${p.feedback === -1 ? 'on-dislike' : ''}" onclick="vote('${p.id}', -1)">👎 싫음</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    const AUTO_CRAWL_INTERVAL_MS = 10 * 60 * 1000;
    const LAST_AUTO_CRAWL_KEY = "dc_feed_last_auto_crawl";

    function maybeAutoCrawlOnOpen() {
      if (isCrawling || !localStorage.getItem(GH_PAT_KEY)) return;
      const last = Number(localStorage.getItem(LAST_AUTO_CRAWL_KEY) || "0");
      if (Date.now() - last >= AUTO_CRAWL_INTERVAL_MS) {
        localStorage.setItem(LAST_AUTO_CRAWL_KEY, String(Date.now()));
        triggerCrawl();
      }
    }

    function refreshOnReturn() {
      if (document.visibilityState === "visible" && !isCrawling) {
        if (Date.now() - lastLoadedAt > 15000) {
          loadData();
        }
        maybeAutoCrawlOnOpen();
      }
    }

    document.addEventListener("visibilitychange", refreshOnReturn);
    window.addEventListener("pageshow", () => {
      if (!isCrawling) loadData();
      maybeAutoCrawlOnOpen();
    });

    setInterval(() => {
      if (document.visibilityState === "visible" && !isCrawling) {
        loadData();
      }
    }, 3 * 60 * 1000);

    loadData();
    maybeAutoCrawlOnOpen();
  </script>
</body>
</html>
